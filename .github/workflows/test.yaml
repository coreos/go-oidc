name: test
on: 
  push:
    branches:
      - v3
  pull_request:
    branches:
      - v3

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.25', '1.26']
    name: Linux Go ${{ matrix.go }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ matrix.go }}
    - name: Test
      run: go test -v ./...
    - name: Staticcheck
      env:
        GOTOOLCHAIN: auto
      run: go tool -modfile=.github/tools/go.mod staticcheck ./...
